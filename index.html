<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세상에서 가장 쓸모없는 식물 TOP 10</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f0a;
    --green-dark: #1a2e1a;
    --green-mid: #2d5a27;
    --green-bright: #4caf50;
    --green-lime: #8bc34a;
    --yellow: #f9c922;
    --orange: #ff6b35;
    --cream: #f5f0e8;
    --text: #e8f5e9;
    --muted: #7a9e7e;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    overflow-x: hidden;
  }

  /* ── INTRO ── */
  #intro {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 2rem;
    background: radial-gradient(ellipse at 60% 40%, #1a3d1a 0%, #0a0f0a 70%);
  }

  .bg-leaves {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .leaf {
    position: absolute;
    font-size: clamp(2rem, 5vw, 5rem);
    opacity: 0.07;
    animation: drift linear infinite;
    user-select: none;
  }

  @keyframes drift {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.07; }
    90%  { opacity: 0.07; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  .channel-badge {
    background: var(--green-bright);
    color: #000;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    padding: 0.3rem 1rem;
    border-radius: 2px;
    margin-bottom: 1.5rem;
    display: inline-block;
    animation: fadeDown 0.6s ease both;
  }

  .intro-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2.5rem, 8vw, 6rem);
    line-height: 1.1;
    color: var(--cream);
    animation: fadeDown 0.7s 0.1s ease both;
  }

  .intro-title span.highlight {
    color: var(--yellow);
    display: inline-block;
  }

  .intro-subtitle {
    margin-top: 1.2rem;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: var(--muted);
    font-weight: 300;
    animation: fadeDown 0.7s 0.2s ease both;
  }

  .scroll-cta {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    animation: fadeDown 0.7s 0.4s ease both;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }

  .scroll-arrow {
    width: 28px;
    height: 28px;
    border-right: 2px solid var(--green-bright);
    border-bottom: 2px solid var(--green-bright);
    transform: rotate(45deg);
    animation: bounce 1.4s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50%       { transform: rotate(45deg) translateY(6px); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── CARDS ── */
  #cards {
    max-width: 860px;
    margin: 0 auto;
    padding: 4rem 1.5rem 6rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  .rank-card {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 1.5rem;
    background: var(--green-dark);
    border: 1px solid #243d24;
    border-radius: 12px;
    padding: 1.8rem;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .rank-img-wrap {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: #1a2e1a;
    margin-top: 0.5rem;
  }

  .rank-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.85);
    transition: filter 0.3s, transform 0.4s;
  }

  .rank-card:hover .rank-img-wrap img {
    filter: saturate(1.15);
    transform: scale(1.06);
  }

  .yt-badge {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,0,0,0.85);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-align: center;
    padding: 3px 0;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .rank-img-wrap {
    position: relative;
  }

  .rank-img-wrap:hover .yt-badge {
    opacity: 1;
  }

  .img-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 2.5rem;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
  }

  .rank-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .rank-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(76,175,80,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .rank-card:hover {
    border-color: var(--green-bright);
    box-shadow: 0 0 30px rgba(76,175,80,0.15);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .rank-num {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 0.3rem;
  }

  .rank-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .rank-number {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 3rem;
    line-height: 1;
    color: var(--green-bright);
  }

  .rank-number.gold   { color: var(--yellow); }
  .rank-number.silver { color: #c0c0c0; }
  .rank-number.bronze { color: #cd7f32; }

  .rank-emoji {
    font-size: 2rem;
    margin-top: 0.4rem;
  }

  .rank-body {}

  .rank-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--cream);
    margin-bottom: 0.25rem;
  }

  .rank-latin {
    font-style: italic;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.8rem;
    font-family: 'Noto Serif KR', serif;
  }

  .rank-desc {
    font-size: 0.9rem;
    line-height: 1.75;
    color: #b8d4ba;
    margin-bottom: 1rem;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .tag {
    font-size: 0.72rem;
    padding: 0.2rem 0.65rem;
    border-radius: 20px;
    font-weight: 500;
  }

  .tag-useless  { background: rgba(255,107,53,0.2);  color: var(--orange); border: 1px solid rgba(255,107,53,0.4); }
  .tag-weird    { background: rgba(139,195,74,0.15); color: var(--green-lime); border: 1px solid rgba(139,195,74,0.35); }
  .tag-fun      { background: rgba(249,201,34,0.15); color: var(--yellow); border: 1px solid rgba(249,201,34,0.35); }
  .tag-toxic    { background: rgba(220,50,50,0.15);  color: #ff6b6b; border: 1px solid rgba(220,50,50,0.3); }

  .useless-meter {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .meter-label {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .meter-bar {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .meter-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--green-mid), var(--green-bright));
    width: 0;
    transition: width 1.2s ease 0.3s;
  }

  .rank-card.visible .meter-fill {
    width: var(--fill);
  }

  /* ── OUTRO ── */
  #outro {
    text-align: center;
    padding: 5rem 2rem;
    background: linear-gradient(180deg, var(--bg), var(--green-dark));
  }

  .outro-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: var(--cream);
    margin-bottom: 1rem;
  }

  .outro-sub {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.8;
    max-width: 500px;
    margin: 0 auto 2rem;
  }

  .like-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--green-bright);
    color: #000;
    border: none;
    border-radius: 40px;
    padding: 0.9rem 2.2rem;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }

  .like-btn:hover { background: var(--green-lime); transform: scale(1.05); }
  .like-btn:active { transform: scale(0.97); }

  /* ── RESPONSIVE ── */
  @media (max-width: 560px) {
    .rank-card { grid-template-columns: 70px 1fr; gap: 1rem; padding: 1.2rem; }
    .rank-number { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<!-- FLOATING LEAVES BG -->
<div class="bg-leaves" id="bgLeaves"></div>

<!-- ── INTRO ── -->
<section id="intro">
  <div class="channel-badge">🌿 식물 다큐멘터리</div>

</section>

const medals = { 1: 'gold', 2: 'silver', 3: 'bronze' };

async function buildCards() {
  const section = document.getElementById('cards');
  const reversed = [...plants].reverse();

  for (let i = 0; i < reversed.length; i++) {
    const p = reversed[i];
    const delay = i * 0.05;
    const medalClass = medals[p.rank] ? ` ${medals[p.rank]}` : '';
    const tagsHtml = p.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('');
    const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(p.ytQuery)}`;

    const card = document.createElement('article');
    card.className = 'rank-card';
    card.style.transitionDelay = `${delay}s`;

    const imgWrap = document.createElement('div');
    imgWrap.className = 'rank-img-wrap';
    imgWrap.title = 'YouTube에서 보기 🎬';
    imgWrap.style.cursor = 'pointer';
    imgWrap.addEventListener('click', () => window.open(ytUrl, '_blank'));

    const img = document.createElement('img');
    img.alt = p.name;
    img.loading = 'lazy';
    // Use Wikipedia image proxy to bypass hotlinking restrictions
    img.src = `https://images.weserv.nl/?url=${encodeURIComponent(p.img)}&w=200&h=200&fit=cover&output=jpg`;
    img.onerror = function() {
      this.replaceWith(Object.assign(document.createElement('div'), {
        className: 'img-placeholder', textContent: p.emoji
      }));
    };
    imgWrap.appendChild(img);

    const ytBadge = document.createElement('div');
    ytBadge.className = 'yt-badge';
    ytBadge.textContent = '▶ YouTube';
    imgWrap.appendChild(ytBadge);

    card.innerHTML = `
      <div class="rank-num">
        <span class="rank-label">RANK</span>
        <span class="rank-number${medalClass}">${p.rank}</span>
      </div>
      <div class="rank-body">
        <div class="rank-name">${p.name}</div>
        <div class="rank-latin">${p.latin}</div>
        <p class="rank-desc">${p.desc}</p>
        <div class="tags">${tagsHtml}</div>
        <div class="useless-meter">
          <span class="meter-label">💎 희귀도 지수</span>
          <div class="meter-bar"><div class="meter-fill" style="--fill:${p.rare}%"></div></div>
          <span class="meter-label" style="min-width:36px;text-align:right">${p.rare}%</span>
        </div>
      </div>
    `;
    card.querySelector('.rank-num').appendChild(imgWrap);
    section.appendChild(card);
  }
}

// Floating leaves
function buildLeaves() {
  const emojis = ['🍃','🌿','🍀','🌱','🪴','🌾','🍂'];
  const container = document.getElementById('bgLeaves');
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('span');
    el.className = 'leaf';
    el.textContent = emojis[i % emojis.length];
    el.style.left = `${Math.random() * 100}%`;
    el.style.animationDuration = `${8 + Math.random() * 14}s`;
    el.style.animationDelay = `${-Math.random() * 20}s`;
    el.style.fontSize = `${1.5 + Math.random() * 3}rem`;
    container.appendChild(el);
  }
}

// Intersection observer
function observeCards() {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.rank-card').forEach(c => io.observe(c));
}

buildLeaves();
buildCards().then(() => observeCards());
</script>
